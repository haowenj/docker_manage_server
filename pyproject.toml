[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-manage-server"
version = "0.1.0"
description = "Docker Manage deployment and container management server"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.2,<8",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docker_manage_server = [
    "templates/*.html",
    "templates/components/*.html",
    "templates/deployments/*.html",
    "templates/containers/*.html",
    "templates/errors/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/vendor/xterm/*.mjs",
    "static/vendor/xterm/*.css",
    "static/vendor/xterm/*.txt",
    "static/vendor/xterm/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
pythonpath = ["src"]
testpaths = ["tests"]
